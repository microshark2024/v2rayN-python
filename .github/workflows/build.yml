name: Build Windows EXE

on:
  pull_request:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install build tools
        run: pip install -r requirements-build.txt

      - name: Build EXE with PyInstaller
        run: pyinstaller v2rayN.spec

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: v2rayN-windows-${{ github.ref_name }}-run${{ github.run_number }}
          path: dist/v2rayN/
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-windows
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: v2rayN-windows-${{ github.ref_name }}-run${{ github.run_number }}
          path: dist/v2rayN

      - name: Create release archive
        run: Compress-Archive -Path dist\v2rayN\* -DestinationPath dist\v2rayN-${{ github.ref_name }}-windows.zip

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/v2rayN-${{ github.ref_name }}-windows.zip
